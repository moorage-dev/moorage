name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway .env (demo site)
        if: hashFiles('apps/demo-site/package.json') != ''
        run: |
          pnpm --filter demo-site exec emdash secrets generate --write .env
          echo "EMDASH_SITE_URL=http://localhost:4321" >> apps/demo-site/.env
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck test validate
      - name: Install Playwright browser
        if: hashFiles('apps/demo-site/playwright.config.ts') != ''
        run: pnpm --filter demo-site exec playwright install --with-deps chromium
      - name: Playwright (demo site)
        if: hashFiles('apps/demo-site/playwright.config.ts') != ''
        run: pnpm --filter demo-site exec playwright test
      - name: Upload Playwright report
        if: failure() && hashFiles('apps/demo-site/playwright-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/demo-site/playwright-report/
            apps/demo-site/test-results/
          retention-days: 14
      - name: Changeset present on PRs
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  # Nightly: does the repo still build and test against the newest EmDash?
  emdash-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # minimum-release-age=0: pnpm 11 otherwise hides packages younger than 24 h, defeating "latest".
      # First run must confirm `pnpm up` rewrites `catalog:` entries; if not, switch to editing pnpm-workspace.yaml.
      - run: pnpm --config.minimum-release-age=0 -r up emdash@latest @emdash-cms/plugin-cli@latest @emdash-cms/plugin-test@latest @emdash-cms/plugin-types@latest @emdash-cms/sandbox-workerd@latest @emdash-cms/plugin-forms@latest
      - run: pnpm turbo run build typecheck test validate
