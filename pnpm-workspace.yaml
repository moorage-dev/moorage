packages:
  - "apps/*"
  - "packages/*"

# Native build scripts pnpm 11 must be allowed to run (sandbox runner, demo site).
allowBuilds:
  workerd: true
  esbuild: true
  sharp: true
  "@parcel/watcher": true

# Pins shared by every package. Values match the EmDash clone's own catalog at the pinned
# emdash version; bump together with `emdash`, then `pnpm install`.
# Re-check monthly.
catalog:
  # EmDash
  emdash: 1.3.0
  "@emdash-cms/plugin-cli": 0.13.4
  "@emdash-cms/plugin-test": 0.2.9
  "@emdash-cms/plugin-types": 0.6.0
  "@emdash-cms/sandbox-workerd": 0.9.4
  "@emdash-cms/plugin-forms": 0.2.10
  "@emdash-cms/blocks": 1.3.0
  # plugin-forms peers (clone catalog)
  "@phosphor-icons/react": ^2.1.10
  "@cloudflare/kumo": 2.6.0
  workerd: ^1.0.0
  # Demo site (templates/marketing in the clone)
  astro: ^7.3.2
  "@astrojs/node": ^11.1.5
  "@astrojs/react": ^7.0.0
  "@astrojs/check": ^0.9.10
  astro-iconset: ^0.0.4
  "@iconify-json/ph": ^1.2.2
  react: 19.2.4
  react-dom: 19.2.4
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  # Build and test (plugin-test peers vitest ^4.1 and vite ^8; do not move to vitest 5 until it does)
  tsdown: 0.20.3
  vite: ^8.3.0
  vitest: 4.1.10
  # DOM for unit-testing plugin-analytics' browser script
  happy-dom: ^20.0.0
  "@playwright/test": ^1.58.0
  typescript: ~6.0.3

minimumReleaseAgeExclude:
  - "@emdash-cms/admin@1.2.0 || 1.3.0"
  - "@emdash-cms/auth@1.2.0 || 1.3.0"
  - "@emdash-cms/blocks@1.2.0 || 1.3.0"
  - "@emdash-cms/cloudflare@1.2.0 || 1.3.0"
  - "@emdash-cms/gutenberg-to-portable-text@1.2.0 || 1.3.0"
  - "@emdash-cms/plugin-cli@0.13.3 || 0.13.4"
  - "@emdash-cms/plugin-test@0.2.8 || 0.2.9"
  - "@emdash-cms/plugin-types@0.6.0"
  - "@emdash-cms/registry-verification@0.3.4"
  - emdash@1.2.0 || 1.3.0
  - "@emdash-cms/plugin-forms@0.2.10"
  - "@emdash-cms/registry-client@0.7.1"
  - "@emdash-cms/sandbox-workerd@0.9.4"
